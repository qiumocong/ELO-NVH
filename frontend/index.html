<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>加速度序列 OK/NG 检测</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 16px 0; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 8px; overflow: auto; }
    button { padding: 10px 14px; }
  </style>
</head>
<body>
  <h2>加速度序列 OK/NG 检测（NPZ）</h2>

  <div class="card">
    <button id="btnStatus">查看服务状态</button>
    <pre id="status"></pre>
  </div>

  <div class="card">
    <p>上传单个样本 <b>.npz</b>（包含 <code>X</code>，shape: (T,3) ��� (20000,3)）：</p>
    <input id="file" type="file" accept=".npz" />
    <button id="btnPredict">预测</button>
    <pre id="result"></pre>
  </div>

<script>
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");

document.getElementById("btnStatus").onclick = async () => {
  statusEl.textContent = "Loading...";
  const r = await fetch("/api/status");
  statusEl.textContent = JSON.stringify(await r.json(), null, 2);
};

document.getElementById("btnPredict").onclick = async () => {
  const f = document.getElementById("file").files[0];
  if (!f) {
    alert("请先选择 .npz 文件");
    return;
  }
  resultEl.textContent = "Predicting...";
  const fd = new FormData();
  fd.append("file", f);

  const r = await fetch("/api/predict_npz", { method: "POST", body: fd });
  resultEl.textContent = JSON.stringify(await r.json(), null, 2);
};
</script>
</body>
</html>
