[project]
name = "yanpu"
version = "0.1.4"
description = "Vibration noise detection with PLC trigger, backend API and desktop frontend."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.124.4",
    "matplotlib>=3.7.5",
    "nidaqmx>=1.0.2",
    "numpy>=1.24.4",
    "openpyxl>=3.1.5",
    "pandas>=2.0.3",
    "pyinstaller>=6.20.0",
    "pymcprotocol>=0.3.0",
    "pyqt5>=5.15.11",
    "pyqtgraph>=0.13.3",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.3.2",
    "soundfile>=0.13.1",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.33.0",
]

[project.scripts]
yanpu-backend = "run_backend:main"
yanpu-frontend = "app.desktop_app:main"

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
